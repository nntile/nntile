[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nntile"
version = "1.1.0"
description = "Python bindings for the NNTile libnntile graph API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
]

[tool.setuptools]
packages = []
