#
# NNTile is software framework for fast training of big neural networks on
# distributed-memory heterogeneous systems based on StarPU runtime system.
#
# @file .github/actions/restore-bundled-nntile-obj-cache/action.yml
#
# Restore the full nntile_objs_cache/ directory saved by bundle-nntile-lib-objs.
#
# @version 1.1.0
name: Restore bundled NNTile library object cache
description: Restore all libnntile_objs_*.a archives from one bundled CI cache
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: build/nntile_objs_cache
        key: nntile-objs-all-a-${{ github.sha }}
        fail-on-cache-miss: true
