# NNTile is software framework for fast training of big neural networks on
# distributed-memory heterogeneous systems based on StarPU runtime system.
#
# @file .github/actions/download-nntile-catch2-deps/action.yml
#
# Fetch Catch2 FetchContent tree from build-test-prerequisites artifact.
#
# @version 1.1.0
name: Download NNTile Catch2 deps
description: Reliable _deps handoff within the same workflow run
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: nntile-catch2-deps
        path: build/_deps
