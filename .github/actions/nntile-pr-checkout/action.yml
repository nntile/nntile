name: NNTile PR checkout helper
description: Deepen and checkout the PR head branch inside a container job
runs:
  using: composite
  steps:
    - name: Pull all PR commits
      if: github.event.pull_request
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        if ! git rev-parse --is-inside-work-tree &>/dev/null; then
          echo "No git repository at workspace: $(pwd)" >&2
          exit 1
        fi
        git config --global --add safe.directory "$(pwd)"
        git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
        git fetch origin ${{ github.ref }}:${{ github.head_ref }} \
          --depth=$(( ${{ github.event.pull_request.commits }} + 1 ))
        git checkout ${{ github.event.pull_request.head.ref }}
        git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=100
