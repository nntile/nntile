name: NNTile CI container setup
description: >-
  Python extras for model integration tests in test-full. StarPU, compilers,
  and PyTorch are provided by the CI sandbox container image.
inputs:
  python-version:
    description: Deprecated; Python comes from the sandbox image
    required: false
    default: ''
  deepen-pr:
    description: Deprecated; unused
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify StarPU installation
      shell: bash
      run: |
        set -euo pipefail
        PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig pkg-config --modversion starpu-1.4
    - name: Verify PyTorch and install model test dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -c "import torch; print(torch.__version__)"
        python3 -m pip install --quiet numpy safetensors "transformers<4.53"
