name: NNTile CI container setup
description: >-
  StarPU, optional PR deepen, and Python+Torch dependencies for NNTile CI
  jobs. Callers must run container bootstrap and actions/checkout@v6 first
  (local actions are not available before checkout).
inputs:
  python-version:
    description: Python version for setup-python
    required: true
  deepen-pr:
    description: Deepen and checkout PR head when event is pull_request
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/nntile-starpu-setup
    - name: Pull all PR commits
      if: >-
        inputs.deepen-pr == 'true' &&
        github.event_name == 'pull_request'
      shell: bash
      run: |
        set -euo pipefail
        git config --global --add safe.directory "$(pwd)"
        git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
        git fetch origin ${{ github.ref }}:${{ github.head_ref }} \
          --depth=$(( ${{ github.event.pull_request.commits }} + 1 ))
        git checkout ${{ github.event.pull_request.head.ref }}
        git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} \
          --depth=100
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        curl -LsSf https://astral.sh/uv/install.sh | sh
        $HOME/.local/bin/uv pip install --system \
          torch --index-url https://download.pytorch.org/whl/cpu
        $HOME/.local/bin/uv pip install --system \
          numpy safetensors "transformers<4.53"
