name: NNTile CI container setup
description: >-
  StarPU, optional PR deepen, and Python+Torch dependencies for NNTile CI
  jobs. Callers must run container bootstrap and actions/checkout@v6 first
  (local actions are not available before checkout).
inputs:
  python-version:
    description: Python version for setup-python
    required: true
  deepen-pr:
    description: >-
      Deprecated; run ./.github/actions/nntile-pr-checkout after checkout
      instead (StarPU cache restore must not run before the repo exists).
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/nntile-starpu-setup
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        curl -LsSf https://astral.sh/uv/install.sh | sh
        $HOME/.local/bin/uv pip install --system \
          torch --index-url https://download.pytorch.org/whl/cpu
        $HOME/.local/bin/uv pip install --system \
          numpy safetensors "transformers<4.53"
