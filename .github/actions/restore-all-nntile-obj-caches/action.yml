#
# NNTile is software framework for fast training of big neural networks on
# distributed-memory heterogeneous systems based on StarPU runtime system.
#
# @file .github/actions/restore-all-nntile-obj-caches/action.yml
#
# Restore every libnntile_objs_*.a archive from per-subsystem compile-check caches.
#
# @version 1.1.0
name: Restore all NNTile library object caches
description: Restore all libnntile_objs_*.a archives produced by compile-check-*
runs:
  using: composite
  steps:
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: kernel}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: starpu}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: core}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: graph_base}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: tile}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: tensor}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: nn}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: runtime}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: module}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: model}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: optim}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: io}
    - uses: ./.github/actions/restore-nntile-obj-cache
      with: {subsystem: dataset}
