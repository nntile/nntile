#
# NNTile is software framework for fast training of big neural networks on
# distributed-memory heterogeneous systems based on StarPU runtime system.
#
# @file .github/actions/restore-nntile-test-obj-deps/action.yml
#
# Restore test OBJECT tarballs produced by compile-check-tests (primary subsystem
# and its deps, e.g. kernel+starpu for starpu) in one cache entry.
#
# @version 1.1.0
name: Restore NNTile test object caches (with deps)
description: Restore bundled nntile_test_objs_*.tar.gz for build-tests
inputs:
  subsystem:
    description: Test subsystem for build-tests (kernel, starpu, core, tile, ...)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: build/nntile_test_objs_cache
        key: nntile-test-obj-deps-${{ inputs.subsystem }}-${{ github.sha }}
        fail-on-cache-miss: true
