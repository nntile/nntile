# @file .github/actions/restore-nntile-test-obj-deps/action.yml
#
# Restore per-subsystem test OBJECT tarballs (see restore-nntile-test-obj-cache).
#
# @version 1.1.0
name: Restore NNTile test object caches (subsystem + deps)
description: >-
  Restore nntile_test_objs_<dep>.tar.gz for every dependency of the given test
  subsystem (including itself). Prefer restore-nntile-test-obj-dep-caches for
  compile jobs that only need upstream deps.
inputs:
  subsystem:
    description: Test subsystem for build-tests (kernel, starpu, core, tile, ...)
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/restore-nntile-test-obj-cache
      if: >-
        inputs.subsystem == 'kernel' || inputs.subsystem == 'starpu'
        || inputs.subsystem == 'core'
      with:
        subsystem: kernel
    - uses: ./.github/actions/restore-nntile-test-obj-cache
      if: inputs.subsystem == 'starpu' || inputs.subsystem == 'core'
      with:
        subsystem: starpu
    - uses: ./.github/actions/restore-nntile-test-obj-cache
      if: >-
        inputs.subsystem == 'kernel' || inputs.subsystem == 'starpu'
        || inputs.subsystem == 'core' || inputs.subsystem == 'tile'
        || inputs.subsystem == 'tensor' || inputs.subsystem == 'nn'
        || inputs.subsystem == 'module' || inputs.subsystem == 'model'
        || inputs.subsystem == 'io'
      with:
        subsystem: ${{ inputs.subsystem }}
