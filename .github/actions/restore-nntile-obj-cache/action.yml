#
# NNTile is software framework for fast training of big neural networks on
# distributed-memory heterogeneous systems based on StarPU runtime system.
#
# @file .github/actions/restore-nntile-obj-cache/action.yml
#
# Restore one subsystem static archive produced by compile-check-*.
#
# @version 1.1.0
name: Restore NNTile object cache
description: Restore libnntile_objs_<subsystem>.a from compile-check job cache
inputs:
  subsystem:
    description: Subsystem name (kernel, tile, graph_base, ...)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: build/nntile_objs_cache/libnntile_objs_${{ inputs.subsystem }}.a
        key: nntile-obj-a-${{ inputs.subsystem }}-${{ github.sha }}
        fail-on-cache-miss: true
