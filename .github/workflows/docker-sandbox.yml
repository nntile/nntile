# NNTile is software framework for fast training of big neural networks on
# distributed-memory heterogeneous systems with GPU acceleration.
#
# @file .github/workflows/docker-sandbox.yml
# Build/publish the NNTile 2.0 sandbox image. The image is rebuilt only when
# its Dockerfile (or this workflow) changes, on the product branches, and
# weekly; CI jobs pull the branch tag instead of installing CUDA/torch.
#
# @version 2.0.0

name: Sandbox image

on:
  push:
    branches: [main, nntile-2.0]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-sandbox.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-sandbox.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ghcr.io/nntile/nntile-sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nntile/nntile-sandbox
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: sandbox
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/nntile/nntile-sandbox:buildcache
          cache-to: type=registry,ref=ghcr.io/nntile/nntile-sandbox:buildcache,mode=max
          sbom: true
          provenance: mode=max
