name: Linting and testing

# Trigger on main and graph_api (feature branch for graph models).
on:
  push:
    branches:
      - main
      - graph_api
  pull_request:
    branches:
      - main
      - graph_api

permissions:
  contents: read

jobs:
  lint:
    name: Linting with Python ${{ matrix.python-version }}
    runs-on: 'ubuntu-24.04'
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - name: Pull all PR commits
        if: github.event.pull_request
        run: |
          # Un-shallow refs.
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          # Deepen topic branch; checkout topic branch.
          git fetch origin ${{ github.ref }}:${{ github.head_ref }} \
            --depth=$(( ${{ github.event.pull_request.commits }} + 1 ))
          git checkout ${{ github.event.pull_request.head.ref }}
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=100
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          cache: 'pip'
          python-version: ${{ matrix.python-version }}
      - name: Run pre-commit on pull request
        uses: pre-commit/action@v3.0.0
        if: github.event.pull_request
        with:
          extra_args: >
            --from-ref "$(git merge-base ${{ github.base_ref }} HEAD)"
            --to-ref "${{ github.head_ref }}"
      - name: Run pre-commit on merge
        uses: pre-commit/action@v3.0.0
        if: '!github.event.pull_request'

  configure-smoke:
    name: Configure smoke (CMake only)
    needs: lint
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    defaults:
      run:
        working-directory: /__w/nntile/nntile
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - name: Check core include paths
        run: .github/scripts/check-core-includes.sh .
      - name: Configure NNTile (smoke)
        run: |
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TESTS_PYTORCH=OFF \
            -DBUILD_PYTHON_WRAPPERS=OFF

  build-core:
    name: Build nntile_core for Python ${{ matrix.python-version }}
    needs:
      - lint
      - configure-smoke
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
      run:
        working-directory: /__w/nntile/nntile
    env:
      CCACHE_DIR: /tmp/ccache
      NNTILE_INSTALL: /__w/nntile/nntile/install
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - name: Pull all PR commits
        if: github.event.pull_request
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin ${{ github.ref }}:${{ github.head_ref }} \
            --depth=$(( ${{ github.event.pull_request.commits }} + 1 ))
          git checkout ${{ github.event.pull_request.head.ref }}
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=100
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv pip install --system \
            torch --index-url https://download.pytorch.org/whl/cpu
          $HOME/.local/bin/uv pip install --system \
            numpy safetensors "transformers<4.53"
      - name: Check core include paths
        run: .github/scripts/check-core-includes.sh .
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}
          restore-keys: |
            ccache-nntile-${{ runner.os }}
          save-always: true
      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
      - name: Configure and build nntile_core
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export TORCH_PREFIX=$(
            python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_GRAPH=OFF \
            -DBUILD_TESTS_GRAPH=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="${NNTILE_INSTALL}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${TORCH_PREFIX}"
          cmake --build build -j
          cmake --build build --target nntile_compile_smoke
          cmake --install build
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
      - name: Upload nntile_core install and extension
        uses: actions/upload-artifact@v7
        with:
          name: nntile-core-${{ matrix.python-version }}
          path: |
            install/
            build/wrappers/python/nntile/nntile_core.so
          retention-days: 7
      - name: Run smoke C++ tests (core)
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ctest --test-dir build -L smoke -E wrappers -LE "(MPI|NotImplemented)" \
            --output-on-failure
      - name: Run dirty C++ tests (core)
        if: github.event.pull_request
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          .github/scripts/run-dirty-cpp-tests.sh \
            ${{ github.event.pull_request.head.ref }} \
            ${{ github.base_ref }} \
            core
      - name: Run core C++ tests
        if: '!github.event.pull_request'
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ctest --test-dir build -L core -E wrappers -LE "(MPI|NotImplemented)" \
            --output-on-failure

  build-graph:
    name: Build nntile_graph for Python ${{ matrix.python-version }}
    needs:
      - lint
      - configure-smoke
      - build-core
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
      run:
        working-directory: /__w/nntile/nntile
    env:
      CCACHE_DIR: /tmp/ccache
      NNTILE_INSTALL: /__w/nntile/nntile/install
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - name: Pull all PR commits
        if: github.event.pull_request
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git fetch origin ${{ github.ref }}:${{ github.head_ref }} \
            --depth=$(( ${{ github.event.pull_request.commits }} + 1 ))
          git checkout ${{ github.event.pull_request.head.ref }}
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=100
      - name: Download nntile_core artifact
        uses: actions/download-artifact@v8
        with:
          name: nntile-core-${{ matrix.python-version }}
          path: .
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          $HOME/.local/bin/uv pip install --system \
            torch --index-url https://download.pytorch.org/whl/cpu
          $HOME/.local/bin/uv pip install --system \
            numpy safetensors "transformers<4.53"
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}
          restore-keys: |
            ccache-nntile-${{ runner.os }}
          save-always: true
      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
      - name: Configure and build nntile_graph
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export TORCH_PREFIX=$(
            python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_CORE=OFF \
            -DBUILD_TESTS_CORE=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DNNTILE_CORE_PREFIX="${NNTILE_INSTALL}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${NNTILE_INSTALL}:${TORCH_PREFIX}"
          cmake --build build -j
          cmake --build build --target nntile_compile_smoke
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
      - name: Verify Python extensions
        run: |
          set -euo pipefail
          test -f build/wrappers/python/nntile/nntile_core.so
          test -f build/wrappers/python/nntile/nntile_graph.so
      - name: Upload Python extensions
        uses: actions/upload-artifact@v7
        with:
          name: shared-objects-${{ matrix.python-version }}
          path: |
            build/wrappers/python/nntile/nntile_graph.so
            build/wrappers/python/nntile/nntile_core.so
          retention-days: 7
      - name: Run smoke C++ tests (graph)
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ctest --test-dir build -L smoke -E wrappers -LE "(MPI|NotImplemented)" \
            --output-on-failure
      - name: Run graph C++ tests
        if: '!github.event.pull_request'
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ctest --test-dir build -L graph -E wrappers -LE "(MPI|NotImplemented)" \
            --output-on-failure
      - name: Run dirty C++ tests (graph)
        if: github.event.pull_request
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          .github/scripts/run-dirty-cpp-tests.sh \
            ${{ github.event.pull_request.head.ref }} \
            ${{ github.base_ref }} \
            graph

  test-python:
    name: Run CPU-only tests with Python ${{ matrix.python-version }}
    needs: build-graph
    runs-on: 'ubuntu-24.04'
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: 'ubuntu:24.04'
    steps:
      - name: Cache system packages
        uses: actions/cache@v5
        id: cache-apt
        env:
          cache-name: cache-apt-packages
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-build-${{ env.cache-name }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}
            ${{ runner.os }}-build-
            ${{ runner.os }}
      - name: Install Git in container
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker*
          apt update
          apt install -y --no-install-recommends ca-certificates git
      # NOTE Step order is important for checkout in container: git
      # installation in container precedes repo checkout.
      # NOTE Values of ${GITHUB_WORKSPACE} and ${{ github.workspace }} differ
      # (see https://github.com/actions/checkout/issues/785 for details).
      - uses: actions/checkout@v6
      - name: Pull all PR commits
        if: github.event.pull_request
        run: |
          # Restore `.git` location.
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          git config --list
          # Un-shallow refs.
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          # Deepen topic branch; checkout topic branch.
          git fetch origin ${{ github.ref }}:${{ github.head_ref }} \
            --depth=$(( ${{ github.event.pull_request.commits }} + 1 ))
          git checkout ${{ github.event.pull_request.head.ref }}
          git fetch origin ${{ github.base_ref }}:${{ github.base_ref }} --depth=100
      - name: Install system dependencies
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker*
          apt update
          apt install -y --no-install-recommends \
              binutils build-essential ca-certificates \
              clang cmake curl libfxt-dev git lcov libhwloc-dev \
              libopenblas-dev libopenmpi-dev libopenmpi3 \
              lsb-release ninja-build openmpi-bin pkg-config sqlite3
      - name: Restore StarPU cache
        uses: actions/cache@v5
        with:
          path: /opt/starpu
          key: starpu-1.4.8-${{ runner.os }}-v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download all shared objects (*.so)
        uses: actions/download-artifact@v8
        with:
          name: shared-objects-${{ matrix.python-version }}
          path: build
      # TODO(@daskol): We should not remove platform tag and rework extension
      # build in general.
      - name: Make in-tree symlink to an extension
        run: |
          ln -rs \
            build/wrappers/python/nntile/nntile_core.so \
            wrappers/python/nntile/nntile_core.so
          ln -rs \
            build/wrappers/python/nntile/nntile_graph.so \
            wrappers/python/nntile/nntile_graph.so
      # TODO(@daskol): We should rely on `uv` or any other package managing
      # utility here.
      - name: Install Python dependencies
        run: |
          # Use `uv` for syncing dependencies directly from `pyproject.toml`
          # (but without`uv.lock` file at the moment).
          python -m pip install uv --root-user-action=ignore
          uv sync --extra ci --extra test \
            --no-install-project --no-build-isolation \
            --default-index https://download.pytorch.org/whl/cpu \
            --index https://download.pytorch.org/whl/cpu \
            --index https://pypi.org/simple \
            --index-strategy unsafe-best-match
      - name: Run dirty tests with PyTest
        if: 'github.event.pull_request'
        run: |
          . .venv/bin/activate
          export LD_LIBRARY_PATH=/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          export PYTHON_TAG=$(
            python -c 'import sys; print(sys.implementation.cache_tag)')
          export PYTHONPATH=$PWD/wrappers/python:$PYTHONPATH
          .github/scripts/run-dirty-py-tests.sh \
            ${{ github.event.pull_request.head.ref }} \
            ${{ github.base_ref }}
      - name: Run all tests with PyTest
        if: '!github.event.pull_request'
        run: |
          . .venv/bin/activate
          export LD_LIBRARY_PATH=/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          export PYTHON_TAG=$(
            python -c 'import sys; print(sys.implementation.cache_tag)')
          export PYTHONPATH=$PWD/wrappers/python:$PYTHONPATH
          pytest -vv \
            --cov=wrappers/python/nntile \
            --cov-report=html:coverage/html/${PYTHON_TAG} \
            --cov-report=xml:coverage/xml/report.${PYTHON_TAG}.xml \
            --junitxml=pytest/report.${PYTHON_TAG}.xml
      - name: Upload PyTest report for Python ${{ matrix.python-version }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: |
            coverage
            pytest
      # This step never fails but it is useful to monitor status of type
      # corectness.
      - name: Run type checking
        run: |
          . .venv/bin/activate
          mypy wrappers/python/nntile || true
