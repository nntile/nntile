name: Build and test

on:
  push:
    branches: [main, graph_api]
  pull_request:
    branches: [main, graph_api]
  workflow_dispatch:
  workflow_call:
    inputs:
      is-pull-request:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/starpu/lib
  DIFF_BASE: graph_api
  CMAKE_COMMON: >-
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DUSE_CUDA=OFF
    -DBUILD_PYTHON_WRAPPERS=OFF
    -DCMAKE_C_COMPILER=gcc
    -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  build-lib:
    name: build libnntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/check-nntile-includes.sh
      - run: .github/scripts/check-nntile-includes.sh .
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-lib-${{ github.sha }}
          restore-keys: ccache-build-lib-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build --target nntile -j"$(nproc)"
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-lib
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-lib-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-build
          path: |
            build/
            !build/_deps/**
          retention-days: 1

  dirty-tests:
    name: build and run dirty tests
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: ./.github/actions/nntile-model-test-python
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - run: rm -rf build/_deps
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-dirty-tests-${{ github.sha }}
          restore-keys: ccache-dirty-tests-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=ON -DBUILD_TESTS_PYTORCH=OFF -DBUILD_EXAMPLES=OFF \
            -DNNTILE_MODEL_PYTHON="${NNTILE_MODEL_PYTHON}"
      - run: |
          chmod +x .github/scripts/ci-dirty-cpp-tests.sh
          .github/scripts/ci-dirty-cpp-tests.sh plan
      - run: .github/scripts/ci-dirty-cpp-tests.sh build
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh dirty-tests
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-dirty-tests-${{ github.sha }}
      - run: .github/scripts/ci-dirty-cpp-tests.sh run

  build-examples:
    name: build examples
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - run: rm -rf build/_deps
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-examples-${{ github.sha }}
          restore-keys: ccache-build-examples-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=ON
          cmake --build build --target nntile_all_examples -j"$(nproc)"
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-examples
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-examples-${{ github.sha }}
