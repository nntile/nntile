    needs: graph-tests-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - name: Bootstrap container (git for checkout)
        working-directory: /
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-pr-checkout
        if: github.event_name == 'pull_request'
      - uses: ./.github/actions/nntile-ci-container
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download graph C++ test build tree
        uses: actions/download-artifact@v8
        with:
          name: nntile-graph-ctest-${{ matrix.python-version }}
          path: .
      - name: Run smoke C++ tests (graph)
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ctest --test-dir build -L smoke -E wrappers -LE "(MPI|NotImplemented)" \
            --output-on-failure
      - name: Run dirty C++ tests (graph)
        if: >-
          github.event_name == 'pull_request' ||
          inputs.is-pull-request == true
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          .github/scripts/run-dirty-cpp-tests.sh \
            ${{ github.event.pull_request.head.ref }} \
            ${{ github.base_ref }} \
            graph
      - name: Run graph C++ tests
        if: >-
          github.event_name != 'pull_request' &&
          inputs.is-pull-request != true
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ctest --test-dir build -L graph -E wrappers -LE "(MPI|NotImplemented)" \
            --output-on-failure

  examples-build:
    name: Build examples
    needs: graph-lib-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
