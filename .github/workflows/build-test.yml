name: Build and test

on:
  push:
    branches: [main, graph_api]
  pull_request:
    branches: [main, graph_api]
  workflow_dispatch:
  workflow_call:
    inputs:
      is-pull-request:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/starpu/lib
  TORCH_PIP_INDEX: https://download.pytorch.org/whl/cpu
  CATCH2_GIT_TAG: v3.11.0
  CATCH2_ARTIFACT: catch2-prefix-v3.11.0
  CMAKE_COMMON: >-
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DUSE_CUDA=OFF
    -DCMAKE_C_COMPILER=gcc
    -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  # -------------------------------------------------------------------------
  # Shared Catch2 (one compile per run; cache across runs)
  # -------------------------------------------------------------------------
  build-catch2:
    name: build Catch2
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake g++ ninja-build
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-catch2-setup
        with:
          git-tag: ${{ env.CATCH2_GIT_TAG }}
          install-prefix: ${{ github.workspace }}/catch2-prefix
          build-type: RelWithDebInfo
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CATCH2_ARTIFACT }}
          path: catch2-prefix/
          retention-days: 1
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Layer 1: libnntile (torch-native: links LibTorch for StarPU aten codelets)
  # -------------------------------------------------------------------------
  build-libnntile:
    name: build libnntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/check-nntile-includes.sh
      - run: .github/scripts/check-nntile-includes.sh .
      - run: chmod +x .github/scripts/check-model-no-swap-axes.sh
      - run: .github/scripts/check-model-no-swap-axes.sh .
      - name: Install LibTorch (CPU)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          echo "TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            >> "${GITHUB_ENV}"
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-libnntile-${{ github.sha }}
          restore-keys: ccache-build-libnntile-
      - name: Configure and build libnntile (NNTILE_TORCH_NATIVE_OPS)
        run: |
          set -euo pipefail
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            ln -sf "$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so | tail -1)" \
              /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTING=OFF \
            -DBUILD_LIBTORCH_NNTILE=OFF \
            -DBUILD_TORCH_NNTILE=OFF \
            -DNNTILE_TORCH_NATIVE_OPS=ON \
            -DCMAKE_PREFIX_PATH="${TORCH_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="${PWD}/prefix"
          cmake --build build --target nntile -j"$(nproc)"
          cmake --install build --prefix "${PWD}/prefix"
          echo "Installed libnntile (torch-native) to ${PWD}/prefix"
          grep -E 'NNTILE_TORCH_NATIVE_OPS' \
            "${PWD}/prefix/include/nntile/defs.h" || true
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-libnntile
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-libnntile-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-prefix
          path: prefix/
          retention-days: 1

  test-libnntile:
    name: test libnntile
    needs: [build-libnntile, build-catch2]
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - name: Install LibTorch (CPU)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          echo "TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@v4
        with:
          name: nntile-prefix
          path: prefix
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CATCH2_ARTIFACT }}
          path: catch2-prefix
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-test-libnntile-${{ github.sha }}
          restore-keys: ccache-test-libnntile-
      - name: Build torch-native C++ tests against installed libnntile
        run: |
          set -euo pipefail
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            ln -sf "$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so | tail -1)" \
              /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
          # catch_discover_tests / test binaries need libnntile + Torch + StarPU.
          export LD_LIBRARY_PATH="${PWD}/prefix/lib:${PWD}/catch2-prefix/lib:/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          export STARPU_SILENT=1 STARPU_FXT_TRACE=0 STARPU_WORKERS_NOBIND=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 GOTO_NUM_THREADS=1
          cmake -S . -B build-tests ${CMAKE_COMMON} \
            -DBUILD_LIBNNTILE=OFF \
            -DBUILD_LIBTORCH_NNTILE=OFF \
            -DBUILD_TORCH_NNTILE=OFF \
            -DBUILD_TESTING=ON \
            -DNNTILE_TORCH_NATIVE_OPS=ON \
            -DCMAKE_PREFIX_PATH="${PWD}/prefix;${PWD}/catch2-prefix;${TORCH_PREFIX}"
          cmake --build build-tests -j"$(nproc)"
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh test-libnntile
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-test-libnntile-${{ github.sha }}
      - name: Restore CTest execute bits
        run: |
          chmod +x .github/scripts/restore-ctest-execute-bits.sh
          chmod +x .github/scripts/list-not-implemented-tests.sh
          .github/scripts/restore-ctest-execute-bits.sh build-tests/nntile/tests
      - name: Run torch-native libnntile C++ tests
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${PWD}/prefix/lib:${PWD}/catch2-prefix/lib:/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          export STARPU_SILENT=1 STARPU_FXT_TRACE=0 STARPU_WORKERS_NOBIND=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 GOTO_NUM_THREADS=1
          echo "Discovered torch_native CTest entries:"
          ctest --test-dir build-tests -N -L torch_native
          # Progress signal for the torch-native stack (starpu/core/tile/tensor).
          ctest --test-dir build-tests -L torch_native \
            --output-on-failure --no-tests=error

  # -------------------------------------------------------------------------
  # Layer 2: libtorch_nntile (links installed libnntile)
  # -------------------------------------------------------------------------
  build-libtorch-nntile:
    name: build libtorch_nntile
    needs: build-libnntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - name: Install LibTorch (CPU)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          echo "TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@v4
        with:
          name: nntile-prefix
          path: prefix
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-libtorch-nntile-${{ github.sha }}
          restore-keys: ccache-build-libtorch-nntile-
      - run: |
          set -euo pipefail
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            ln -sf "$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so | tail -1)" \
              /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
          cmake -S . -B build-torch ${CMAKE_COMMON} \
            -DBUILD_LIBNNTILE=OFF \
            -DBUILD_LIBTORCH_NNTILE=ON \
            -DBUILD_TORCH_NNTILE=OFF \
            -DBUILD_TESTING=OFF \
            -DNNTILE_TORCH_NATIVE_OPS=ON \
            -DCMAKE_PREFIX_PATH="${PWD}/prefix;${TORCH_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="${PWD}/prefix"
          cmake --build build-torch --target torch_nntile -j"$(nproc)"
          cmake --install build-torch --prefix "${PWD}/prefix"
          echo "Installed libtorch_nntile (torch-native) to ${PWD}/prefix"      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-libtorch-nntile
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-libtorch-nntile-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-torch-prefix
          path: prefix/
          retention-days: 1

  test-libtorch-nntile:
    name: test libtorch_nntile
    needs: [build-libtorch-nntile, build-catch2]
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip \
            pkg-config
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - name: Install LibTorch (CPU)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          echo "TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@v4
        with:
          name: nntile-torch-prefix
          path: prefix
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CATCH2_ARTIFACT }}
          path: catch2-prefix
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-test-libtorch-nntile-${{ github.sha }}
          restore-keys: ccache-test-libtorch-nntile-
      - name: Build and run libtorch_nntile C++ tests
        run: |
          set -euo pipefail
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            ln -sf "$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so | tail -1)" \
              /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
          # Needed during cmake --build: catch_discover_tests runs binaries
          # to list Catch2 cases (DT_RUNPATH is not transitive to libnntile).
          export LD_LIBRARY_PATH="${PWD}/prefix/lib:${PWD}/catch2-prefix/lib:/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          export STARPU_SILENT=1 STARPU_FXT_TRACE=0 STARPU_WORKERS_NOBIND=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 GOTO_NUM_THREADS=1
          cmake -S . -B build-torch-tests ${CMAKE_COMMON} \
            -DBUILD_LIBNNTILE=OFF \
            -DBUILD_LIBTORCH_NNTILE=OFF \
            -DBUILD_TORCH_NNTILE=OFF \
            -DBUILD_TESTING=ON \
            -DNNTILE_TORCH_NATIVE_OPS=ON \
            -DCMAKE_PREFIX_PATH="${PWD}/prefix;${PWD}/catch2-prefix;${TORCH_PREFIX}"
          cmake --build build-torch-tests -j"$(nproc)" \
            --target tests_libtorch_nntile_smoke \
                    tests_libtorch_nntile_aten_ops
          echo "Discovered libtorch_nntile CTest entries (aten parity progress):"
          ctest --test-dir build-torch-tests -N -L libtorch_nntile
          # --no-tests=error: compiling alone must not green-pass.
          ctest --test-dir build-torch-tests -L libtorch_nntile \
            --output-on-failure --no-tests=error
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh test-libtorch-nntile
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-test-libtorch-nntile-${{ github.sha }}

  # -------------------------------------------------------------------------
  # Layer 3: torch_nntile product (wheel) from installed libs, then pytest
  # -------------------------------------------------------------------------
  build-torch-nntile:
    name: build torch_nntile
    needs: build-libtorch-nntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip g++ ninja-build \
            pkg-config
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-torch-prefix
          path: prefix
      - name: Install LibTorch (CPU) for extension build
        run: |
          set -euo pipefail
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          pip3 install --break-system-packages \
            'setuptools>=61' wheel ninja
          echo "TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            >> "${GITHUB_ENV}"
      - name: Build wheel via CMake (installed libs)
        run: |
          set -euo pipefail
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            ln -sf "$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so | tail -1)" \
              /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
          cmake -S . -B build-wheel ${CMAKE_COMMON} \
            -DBUILD_LIBNNTILE=OFF \
            -DBUILD_LIBTORCH_NNTILE=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_TORCH_NNTILE=ON \
            -DTORCH_NNTILE_WHEEL_REPAIR=OFF \
            -DNNTILE_PREFIX="${PWD}/prefix" \
            -DTORCH_NNTILE_PREFIX="${PWD}/prefix" \
            -DTORCH_NNTILE_WHEELHOUSE="${PWD}/wheelhouse" \
            -DCMAKE_PREFIX_PATH="${PWD}/prefix;${TORCH_PREFIX}" \
            -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build build-wheel --target torch_nntile_wheel -j"$(nproc)"
          ls -la wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: torch-nntile-ci-wheel
          path: wheelhouse/*.whl
          retention-days: 1
          if-no-files-found: error

  test-torch-nntile:
    name: test torch_nntile
    needs: build-torch-nntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip \
            pkg-config
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-torch-prefix
          path: prefix
      - uses: actions/download-artifact@v4
        with:
          name: torch-nntile-ci-wheel
          path: wheelhouse
      - name: Install wheel and run torch-native Python smoke
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export LD_LIBRARY_PATH="${PWD}/prefix/lib:/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          export STARPU_SILENT=1 STARPU_FXT_TRACE=0 STARPU_WORKERS_NOBIND=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 GOTO_NUM_THREADS=1
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          pip3 install --break-system-packages \
            pytest 'numpy>=1.21' 'transformers<4.53'
          # --no-deps: avoid pulling extras; nvidia-*-cu12 are only required
          # for CUDA-built wheels (gated at import via built_with_cuda()).
          pip3 install --break-system-packages \
            --force-reinstall --no-deps wheelhouse/*.whl
          # Prefer the installed wheel over the source tree (no in-tree _C.so).
          python3 - <<'PY'
          import torch_nntile as t
          assert t.TORCH_NATIVE_OPS, "CI wheel must be NNTILE_TORCH_NATIVE_OPS"
          print(f"TORCH_NATIVE_OPS={t.TORCH_NATIVE_OPS} BUILT_WITH_CUDA={t.built_with_cuda()}")
          PY
          # Aten fwd+bwd parity is C++ ctest (test-libtorch-nntile).
          # Under torch-native, run the allowlisted Python smoke suite only.
          pytest -vv --override-ini='pythonpath=' \
            torch_nntile/tests/test_device_stub.py \
            torch_nntile/tests/test_context_restrict.py \
            torch_nntile/tests/test_libtorch_nntile_smoke.py \
            torch_nntile/tests/test_cuda_deps.py
