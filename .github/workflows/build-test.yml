name: Build and test

on:
  push:
    branches: [main, graph_api]
  pull_request:
    branches: [main, graph_api]
  workflow_dispatch:
  workflow_call:
    inputs:
      is-pull-request:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/starpu/lib
  CMAKE_COMMON: >-
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DUSE_CUDA=OFF
    -DNNTILE_PRESET=full
    -DBUILD_PYTHON_WRAPPERS=OFF
    -DCMAKE_C_COMPILER=gcc
    -DCMAKE_CXX_COMPILER=g++

jobs:
  build-lib:
    name: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/check-nntile-includes.sh
      - run: .github/scripts/check-nntile-includes.sh .
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-lib-${{ github.sha }}
          restore-keys: ccache-build-lib-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build --target nntile -j"$(nproc)"
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-lib-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-build
          path: build/
          retention-days: 1

  build-tests:
    name: build-tests
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-tests-${{ github.sha }}
          restore-keys: ccache-build-tests-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=ON -DBUILD_TESTS_PYTORCH=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build -j"$(nproc)"
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-tests-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-build-tests
          path: build/
          retention-days: 1

  run-tests:
    name: run-tests
    needs: build-tests
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build-tests
          path: build
      - run: |
          cd build
          ctest -E wrappers -LE "(MPI|NotImplemented|FixtureData)" \
            -j"$(nproc)" --output-on-failure

  build-examples:
    name: build-examples
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-examples-${{ github.sha }}
          restore-keys: ccache-build-examples-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=ON
          cmake --build build --target nntile_all_examples -j"$(nproc)"
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-examples-${{ github.sha }}
