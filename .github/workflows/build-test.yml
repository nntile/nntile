name: Build and test

on:
  push:
    branches: [main, graph_api]
  pull_request:
    branches: [main, graph_api]
  workflow_dispatch:
  workflow_call:
    inputs:
      is-pull-request:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/starpu/lib

jobs:
  configure-smoke:
    name: Configure smoke (CMake only)
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/check-nntile-includes.sh
      - run: .github/scripts/check-nntile-includes.sh .
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPERS=OFF

  compile-check:
    name: compile-check-${{ matrix.subsystem }}
    needs: configure-smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        subsystem:
          - kernel
          - starpu
          - core
          - graph_base
          - tile
          - tensor
          - nn
          - runtime
          - module
          - optim
          - io
          - dataset
          - model
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-compile-${{ matrix.subsystem }}-${{ github.sha }}
          restore-keys: ccache-compile-${{ matrix.subsystem }}-
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_COMPILE_CHECK_SUBSYSTEM=${{ matrix.subsystem }} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPERS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target nntile_compile_check_${{ matrix.subsystem }}
      - run: |
          chmod +x .github/scripts/pack-nntile-objs-archive.sh
          .github/scripts/pack-nntile-objs-archive.sh "${{ matrix.subsystem }}" build
      - uses: actions/cache/save@v4
        with:
          path: build/nntile_objs_cache/libnntile_objs_${{ matrix.subsystem }}.a
          key: nntile-obj-a-${{ matrix.subsystem }}-${{ github.sha }}

  # One restore of all lib archives for link-only jobs (avoids 13 cache hits per matrix job).
  bundle-nntile-lib-objs:
    name: bundle lib object archives
    needs: compile-check
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: ./.github/actions/restore-all-nntile-obj-caches
      - run: .github/scripts/restore-nntile-objs-verify.sh build
      - uses: actions/cache/save@v4
        with:
          path: build/nntile_objs_cache
          key: nntile-objs-all-a-${{ github.sha }}

  # Build Catch2 (FetchContent) once; downstream test jobs download via artifact.
  build-test-prerequisites:
    name: build-test-prerequisites
    needs: configure-smoke
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-test-prerequisites-${{ github.sha }}
          restore-keys: ccache-test-prerequisites-
      - run: chmod +x .github/scripts/cmake-build-test-prerequisites.sh
      - run: |
          .github/scripts/cmake-build-test-prerequisites.sh build
      - uses: actions/cache/save@v4
        with:
          path: build/_deps
          key: nntile-test-deps-catch2-v3.11.0-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-catch2-deps
          path: build/_deps
          retention-days: 1

  build-nntile:
    name: build-nntile (link only)
    needs: bundle-nntile-lib-objs
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/restore-nntile-objs-verify.sh
      - uses: ./.github/actions/restore-bundled-nntile-obj-cache
      - run: .github/scripts/restore-nntile-objs-verify.sh build
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_PRESET=full -DNNTILE_LINK_CACHED_OBJECTS=ON \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_PYTHON_WRAPPERS=OFF
      - run: |
          echo "=== ninja plan (no subsystem .cc compile; link + context/logger only) ==="
          ninja -C build -n nntile 2>&1 | tee /tmp/nntile-ninja-plan.txt
          if grep -E 'CXX_COMPILER|CUDA_COMPILER' /tmp/nntile-ninja-plan.txt \
              | grep -qE 'nntile/src/CMakeFiles/nntile_objs_'; then
            echo "unexpected subsystem source compile (use cached .a only)" >&2
            grep -E 'CXX_COMPILER|CUDA_COMPILER' /tmp/nntile-ninja-plan.txt \
              | grep 'nntile/src/CMakeFiles/nntile_objs_' >&2 || true
            exit 1
          fi
          cmake --build build --target nntile -j"$(nproc)"
      - run: |
          chmod +x .github/scripts/nntile-prebuilt-lib-path.sh
          .github/scripts/nntile-prebuilt-lib-path.sh build
      - uses: actions/cache/save@v4
        with:
          path: |
            build/nntile/libnntile.so
            build/include/nntile/defs.h
          key: nntile-lib-linked-${{ github.sha }}

  # Per subsystem: compile-check-tests → build-tests → test-run (1:1 deps inside reusable workflow).
  subsystem-test:
    name: subsystem-test-${{ matrix.subsystem }}
    needs: [configure-smoke, build-nntile, build-test-prerequisites]
    strategy:
      fail-fast: false
      matrix:
        subsystem:
          - kernel
          - starpu
          - core
          - tile
          - tensor
          - nn
          - module
          - model
          - io
    uses: ./.github/workflows/subsystem-test-pipeline.yml
    with:
      subsystem: ${{ matrix.subsystem }}

  test-full:
    name: test-full-integration
    needs: [build-nntile, subsystem-test]
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-ci-container
        with: {python-version: '3.12'}
      - run: |
          export TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_PRESET=full -DBUILD_TESTS=ON -DBUILD_TESTS_PYTORCH=ON \
            -DCMAKE_PREFIX_PATH="${TORCH_PREFIX}" \
            -DBUILD_EXAMPLES=ON
          cmake --build build -j"$(nproc)"
          cd build && ctest -LE NotImplemented -j"$(nproc)" --output-on-failure
