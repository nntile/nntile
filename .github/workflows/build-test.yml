name: Build and test

on:
  push:
    branches: [main, graph_api]
  pull_request:
    branches: [main, graph_api]
  workflow_dispatch:
  workflow_call:
    inputs:
      is-pull-request:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/starpu/lib
  TORCH_PIP_INDEX: https://download.pytorch.org/whl/cpu
  CMAKE_COMMON: >-
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DUSE_CUDA=OFF
    -DCMAKE_C_COMPILER=gcc
    -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  # -------------------------------------------------------------------------
  # Layer 1: libnntile (no LibTorch)
  # -------------------------------------------------------------------------
  build-libnntile:
    name: build libnntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/check-nntile-includes.sh
      - run: .github/scripts/check-nntile-includes.sh .
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-libnntile-${{ github.sha }}
          restore-keys: ccache-build-libnntile-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=OFF -DBUILD_TORCH_NNTILE=OFF \
            -DCMAKE_INSTALL_PREFIX="${PWD}/prefix"
          cmake --build build --target nntile -j"$(nproc)"
          cmake --install build --prefix "${PWD}/prefix"
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-libnntile
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-libnntile-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-prefix
          path: prefix/
          retention-days: 1

  test-libnntile:
    name: test libnntile
    needs: build-libnntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-prefix
          path: prefix
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-test-libnntile-${{ github.sha }}
          restore-keys: ccache-test-libnntile-
      - name: Build tests against installed libnntile
        run: |
          cmake -S . -B build-tests ${CMAKE_COMMON} \
            -DBUILD_NNTILE=OFF -DBUILD_TORCH_NNTILE=OFF -DBUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="${PWD}/prefix"
          cmake --build build-tests -j"$(nproc)"
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh test-libnntile
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-test-libnntile-${{ github.sha }}
      - name: Restore CTest execute bits
        run: |
          chmod +x .github/scripts/restore-ctest-execute-bits.sh
          chmod +x .github/scripts/list-not-implemented-tests.sh
          .github/scripts/restore-ctest-execute-bits.sh build-tests/nntile/tests
      - name: Run C++ tests (ctest)
        run: |
          export LD_LIBRARY_PATH="${PWD}/prefix/lib:${PWD}/build-tests/_deps/catch2-build/src:${LD_LIBRARY_PATH:-}"
          export STARPU_SILENT=1 STARPU_FXT_TRACE=0 STARPU_WORKERS_NOBIND=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 GOTO_NUM_THREADS=1
          .github/scripts/list-not-implemented-tests.sh build-tests || true
          ctest --test-dir build-tests -LE NotImplemented --output-on-failure

  # -------------------------------------------------------------------------
  # Layer 2: libtorch_nntile (links installed libnntile)
  # -------------------------------------------------------------------------
  build-libtorch-nntile:
    name: build libtorch_nntile
    needs: build-libnntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - name: Install LibTorch (CPU)
        run: |
          set -euo pipefail
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          echo "TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@v4
        with:
          name: nntile-prefix
          path: prefix
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-libtorch-nntile-${{ github.sha }}
          restore-keys: ccache-build-libtorch-nntile-
      - run: |
          set -euo pipefail
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            ln -sf "$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so | tail -1)" \
              /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
          cmake -S . -B build-torch ${CMAKE_COMMON} \
            -DBUILD_NNTILE=OFF -DBUILD_TORCH_NNTILE=ON -DBUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="${PWD}/prefix;${TORCH_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="${PWD}/prefix"
          cmake --build build-torch --target torch_nntile -j"$(nproc)"
          cmake --install build-torch --prefix "${PWD}/prefix"
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-libtorch-nntile
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-libtorch-nntile-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-torch-prefix
          path: prefix/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Layer 3: CMake wheel from installed libs, then Python tests
  # -------------------------------------------------------------------------
  build-torch-nntile-wheel:
    name: build torch_nntile wheel
    needs: build-libtorch-nntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip g++ ninja-build \
            pkg-config
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-torch-prefix
          path: prefix
      - name: Install LibTorch (CPU) for extension build
        run: |
          set -euo pipefail
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          pip3 install --break-system-packages \
            'setuptools>=61' wheel ninja
          echo "TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')" \
            >> "${GITHUB_ENV}"
      - name: Build wheel via CMake (installed libs)
        run: |
          set -euo pipefail
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            ln -sf "$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so | tail -1)" \
              /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
          cmake -S . -B build-wheel ${CMAKE_COMMON} \
            -DBUILD_NNTILE=OFF \
            -DBUILD_TORCH_NNTILE=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TORCH_NNTILE_WHEEL=ON \
            -DTORCH_NNTILE_WHEEL_REPAIR=OFF \
            -DNNTILE_PREFIX="${PWD}/prefix" \
            -DTORCH_NNTILE_PREFIX="${PWD}/prefix" \
            -DTORCH_NNTILE_WHEELHOUSE="${PWD}/wheelhouse" \
            -DCMAKE_PREFIX_PATH="${PWD}/prefix;${TORCH_PREFIX}" \
            -DPython3_EXECUTABLE="$(command -v python3)"
          cmake --build build-wheel --target torch_nntile_wheel -j"$(nproc)"
          ls -la wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: torch-nntile-ci-wheel
          path: wheelhouse/*.whl
          retention-days: 1
          if-no-files-found: error

  test-libtorch-nntile:
    name: test libtorch_nntile
    needs: build-torch-nntile-wheel
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip \
            pkg-config
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-torch-prefix
          path: prefix
      - uses: actions/download-artifact@v4
        with:
          name: torch-nntile-ci-wheel
          path: wheelhouse
      - name: Install wheel and run libtorch_nntile tests
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export LD_LIBRARY_PATH="${PWD}/prefix/lib:/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          export STARPU_SILENT=1 STARPU_FXT_TRACE=0 STARPU_WORKERS_NOBIND=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 GOTO_NUM_THREADS=1
          pip3 install --break-system-packages \
            'torch==2.9.1' 'torchvision==0.24.1' \
            --index-url "${TORCH_PIP_INDEX}"
          pip3 install --break-system-packages \
            pytest 'numpy>=1.21' 'transformers<4.53'
          # pyproject declares nvidia-*-cu12 on Linux; --no-deps skips them.
          pip3 install --break-system-packages \
            nvidia-cublas-cu12 nvidia-cudnn-cu12 nvidia-cusparse-cu12 \
            nvidia-cusolver-cu12 nvidia-nvjitlink-cu12 nvidia-cuda-runtime-cu12
          pip3 install --break-system-packages \
            --force-reinstall --no-deps wheelhouse/*.whl
          # Prefer the installed wheel over the source tree (no in-tree _C.so).
          # Clear pytest pythonpath so repo/project roots do not shadow it.
          # Smoke first, then ATen op parity (fwd+bwd) + remaining suite.
          pytest -vv --override-ini='pythonpath=' \
            torch_nntile/tests/test_libtorch_nntile_smoke.py \
            torch_nntile/tests/test_aten_ops_parity.py
          pytest -vv --override-ini='pythonpath=' -m 'not slow' \
            torch_nntile/tests/
