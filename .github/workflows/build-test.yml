name: Build and test

on:
  push:
    branches: [main, graph_api]
  pull_request:
    branches: [main, graph_api]
  workflow_dispatch:
  workflow_call:
    inputs:
      is-pull-request:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig

jobs:
  configure-smoke:
    name: Configure smoke (CMake only)
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/check-nntile-includes.sh
      - run: .github/scripts/check-nntile-includes.sh .
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPERS=OFF

  compile-check:
    name: compile-check-${{ matrix.subsystem }}
    needs: configure-smoke
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        subsystem:
          - kernel
          - starpu
          - core
          - graph_base
          - tile
          - tensor
          - nn
          - runtime
          - module
          - optim
          - io
          - dataset
          - model
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-compile-${{ matrix.subsystem }}-${{ github.sha }}
          restore-keys: ccache-compile-${{ matrix.subsystem }}-
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_COMPILE_CHECK_SUBSYSTEM=${{ matrix.subsystem }} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPERS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target nntile_compile_check_${{ matrix.subsystem }}
      - run: |
          chmod +x .github/scripts/pack-nntile-objs-archive.sh
          .github/scripts/pack-nntile-objs-archive.sh "${{ matrix.subsystem }}" build
      - uses: actions/cache/save@v4
        with:
          path: build/nntile_objs_cache/libnntile_objs_${{ matrix.subsystem }}.a
          key: nntile-obj-a-${{ matrix.subsystem }}-${{ github.sha }}

  # Build Catch2 (FetchContent) once; downstream test jobs download via artifact.
  build-test-prerequisites:
    name: build-test-prerequisites
    needs: configure-smoke
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-test-prerequisites-${{ github.sha }}
          restore-keys: ccache-test-prerequisites-
      - run: chmod +x .github/scripts/cmake-build-test-prerequisites.sh
      - run: |
          .github/scripts/cmake-build-test-prerequisites.sh build
      - uses: actions/cache/save@v4
        with:
          path: build/_deps
          key: nntile-test-deps-catch2-v3.11.0-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-catch2-deps
          path: build/_deps
          retention-days: 1

  # Compile test translation units only (OBJECT lib, no libnntile / no executables).
  compile-check-tests:
    name: compile-check-tests-${{ matrix.subsystem }}
    needs: [configure-smoke, build-test-prerequisites]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        subsystem:
          - kernel
          - starpu
          - core
          - tile
          - tensor
          - nn
          - module
          - model
          - io
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: ./.github/actions/download-nntile-catch2-deps
      - run: |
          chmod +x .github/scripts/cmake-build-tests-subsystem.sh
          chmod +x .github/scripts/pack-nntile-test-objs.sh
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_COMPILE_CHECK_TESTS_SUBSYSTEM=${{ matrix.subsystem }} \
            -DNNTILE_FETCHCONTENT_DISCONNECTED=ON \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPERS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target nntile_compile_check_tests_${{ matrix.subsystem }}
      - run: .github/scripts/pack-nntile-test-objs.sh "${{ matrix.subsystem }}" build
      - uses: actions/cache/save@v4
        with:
          path: build/nntile_test_objs_cache/nntile_test_objs_${{ matrix.subsystem }}.tar.gz
          key: nntile-test-obj-${{ matrix.subsystem }}-${{ github.sha }}

  build-nntile:
    name: build-nntile (link only)
    needs: compile-check
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/restore-nntile-objs-verify.sh
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: kernel}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: starpu}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: core}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: graph_base}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: tile}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: tensor}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: nn}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: runtime}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: module}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: model}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: optim}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: io}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: dataset}
      - run: .github/scripts/restore-nntile-objs-verify.sh build
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_PRESET=full -DNNTILE_LINK_CACHED_OBJECTS=ON \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_PYTHON_WRAPPERS=OFF
      - run: |
          echo "=== ninja plan (no subsystem .cc compile; link + context/logger only) ==="
          ninja -C build -n nntile 2>&1 | tee /tmp/nntile-ninja-plan.txt
          if grep -E 'CXX_COMPILER|CUDA_COMPILER' /tmp/nntile-ninja-plan.txt \
              | grep -qE 'nntile/src/CMakeFiles/nntile_objs_'; then
            echo "unexpected subsystem source compile (use cached .a only)" >&2
            grep -E 'CXX_COMPILER|CUDA_COMPILER' /tmp/nntile-ninja-plan.txt \
              | grep 'nntile/src/CMakeFiles/nntile_objs_' >&2 || true
            exit 1
          fi
          cmake --build build --target nntile -j"$(nproc)"

  # Link test executables (cached libnntile + cached test .o from compile-check-tests).
  build-tests:
    name: build-tests-${{ matrix.subsystem }}
    needs: [build-nntile, compile-check-tests, build-test-prerequisites]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        subsystem:
          - kernel
          - starpu
          - core
          - tile
          - tensor
          - nn
          - module
          - model
          - io
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: ./.github/actions/download-nntile-catch2-deps
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: kernel}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: starpu}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: core}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: graph_base}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: tile}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: tensor}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: nn}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: runtime}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: module}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: model}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: optim}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: io}
      - uses: ./.github/actions/restore-nntile-obj-cache
        with: {subsystem: dataset}
      - uses: ./.github/actions/restore-nntile-test-obj-cache
        with:
          subsystem: ${{ matrix.subsystem }}
      - run: |
          chmod +x .github/scripts/cmake-build-tests-subsystem.sh \
            .github/scripts/cmake-test-build-targets.sh \
            .github/scripts/restore-nntile-objs-verify.sh \
            .github/scripts/restore-nntile-test-objs-verify.sh
          mapfile -t _test_flags < <(.github/scripts/cmake-build-tests-subsystem.sh "${{ matrix.subsystem }}")
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_PRESET=full -DNNTILE_LINK_CACHED_OBJECTS=ON \
            -DNNTILE_LINK_CACHED_TEST_OBJECTS=ON \
            -DBUILD_TESTS=ON -DBUILD_TESTS_PYTORCH=OFF \
            -DNNTILE_FETCHCONTENT_DISCONNECTED=ON \
            -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPERS=OFF \
            "${_test_flags[@]}"
          .github/scripts/restore-nntile-objs-verify.sh build
          mkdir -p build/nntile/tests/CMakeFiles
          tar -xzf "build/nntile_test_objs_cache/nntile_test_objs_${{ matrix.subsystem }}.tar.gz" \
            -C build/nntile/tests/CMakeFiles
          .github/scripts/restore-nntile-test-objs-verify.sh "${{ matrix.subsystem }}" build
          echo "=== BUILD_TESTS_* (must enable only this subsystem) ==="
          grep '^BUILD_TESTS_' build/CMakeCache.txt || true
          mapfile -t _test_targets < <(.github/scripts/cmake-test-build-targets.sh \
            "${{ matrix.subsystem }}" build)
          echo "=== ninja plan (link tests + libnntile only) ==="
          ninja -C build -n nntile "${_test_targets[@]}" 2>&1 | tee /tmp/build-tests-ninja-plan.txt
          if grep -E 'CXX_COMPILER|CUDA_COMPILER' /tmp/build-tests-ninja-plan.txt \
              | grep -qE 'nntile/src/CMakeFiles/nntile_objs_|nntile/tests/CMakeFiles/nntile_test_objs_.*\.cc\.o:'; then
            echo "unexpected test/lib subsystem compile" >&2
            grep -E 'CXX_COMPILER|CUDA_COMPILER' /tmp/build-tests-ninja-plan.txt \
              | grep -E 'nntile_objs_|nntile_test_objs_' >&2 || true
            exit 1
          fi
          echo "Linking libnntile + ${#_test_targets[@]} test executable(s)"
          cmake --build build --target nntile "${_test_targets[@]}" -j"$(nproc)"
      - uses: actions/cache/save@v4
        with:
          path: build
          key: build-tests-${{ matrix.subsystem }}-${{ github.sha }}

  # Run CTest for one subsystem only (no compile; uses build-tests cache).
  test-run:
    name: test-run-${{ matrix.subsystem }}
    needs: build-tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        subsystem:
          - kernel
          - starpu
          - core
          - tile
          - tensor
          - nn
          - module
          - model
          - io
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/cache/restore@v4
        with:
          path: build
          key: build-tests-${{ matrix.subsystem }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: chmod +x .github/scripts/ctest-run-subsystem.sh
      - run: |
          _re=$(.github/scripts/ctest-run-subsystem.sh "${{ matrix.subsystem }}")
          cd build && ctest -R "${_re}" -j"$(nproc)" --output-on-failure

  test-full:
    name: test-full-integration
    needs: [build-nntile, compile-check-tests, build-tests, test-run]
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-ci-container
        with: {python-version: '3.12'}
      - run: |
          export TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_PRESET=full -DBUILD_TESTS=ON -DBUILD_TESTS_PYTORCH=ON \
            -DCMAKE_PREFIX_PATH="${TORCH_PREFIX}" \
            -DBUILD_EXAMPLES=ON
          cmake --build build -j"$(nproc)"
          cd build && ctest -j"$(nproc)" --output-on-failure

  test-python:
    name: test-python
    needs: build-nntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-ci-container
        with: {python-version: '3.12'}
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_PRESET=full -DBUILD_PYTHON_WRAPPERS=ON -DBUILD_TESTS=OFF
          cmake --build build --target nntile_py -j"$(nproc)"
          export PYTHONPATH="${PWD}/build/python"
          python3 -c "import nntile; print('ok', nntile.NNGraph)"
