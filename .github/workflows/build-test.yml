name: Build and test

on:
  push:
    branches: [main, graph_api]
  pull_request:
    branches: [main, graph_api]
  workflow_dispatch:
  workflow_call:
    inputs:
      is-pull-request:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/starpu/lib
  CMAKE_COMMON: >-
    -DCMAKE_BUILD_TYPE=RelWithDebInfo
    -DUSE_CUDA=OFF
    -DBUILD_PYTHON_WRAPPERS=OFF
    -DCMAKE_C_COMPILER=gcc
    -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  build-lib:
    name: build libnntile
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - run: chmod +x .github/scripts/check-nntile-includes.sh
      - run: .github/scripts/check-nntile-includes.sh .
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-lib-${{ github.sha }}
          restore-keys: ccache-build-lib-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build --target nntile -j"$(nproc)"
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-lib
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-lib-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: nntile-build
          path: |
            build/
            !build/_deps/**
          retention-days: 1

  build-and-run-tests:
    name: build and run tests
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: ./.github/actions/nntile-model-test-python
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - run: rm -rf build/_deps
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-tests-${{ github.sha }}
          restore-keys: ccache-build-tests-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=ON -DBUILD_TESTS_PYTORCH=OFF -DBUILD_EXAMPLES=OFF \
            -DNNTILE_MODEL_PYTHON="${NNTILE_MODEL_PYTHON}"
          cmake --build build -j"$(nproc)"
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-tests
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-tests-${{ github.sha }}
      - run: |
          chmod +x .github/scripts/restore-ctest-execute-bits.sh
          chmod +x .github/scripts/list-not-implemented-tests.sh
          .github/scripts/restore-ctest-execute-bits.sh build/nntile/tests
          export LD_LIBRARY_PATH="${PWD}/build/nntile:${PWD}/build/_deps/catch2-build/src:${LD_LIBRARY_PATH:-}"
          .github/scripts/list-not-implemented-tests.sh build || true
          ctest --test-dir build -E wrappers -LE NotImplemented \
            -j"$(nproc)" --output-on-failure

  test-cmake-install:
    name: test cmake install
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: apt-get update && apt-get install -y ca-certificates git
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - run: rm -rf build/_deps
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-test-install-${{ github.sha }}
          restore-keys: ccache-test-install-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build --target nntile -j"$(nproc)"
          cmake \
            -DBUILD_DIR="${PWD}/build" \
            -DCMAKE_INSTALL_PREFIX="${PWD}/build/nntile-install-test-prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DNNTILE_INSTALL_LIB_BASENAME=libnntile.so \
            -P nntile/tests/verify_install.cmake
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-test-install-${{ github.sha }}

  build-python:
    name: build and test python package
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3-dev python3-pip
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - run: rm -rf build/_deps
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc \
            -DBUILD_PYTHON_WRAPPERS=ON \
            -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DBUILD_TESTS_PYTORCH=OFF
          cmake --build build --target nntile_py -j"$(nproc)"
      - run: |
          python3 -m pip install --break-system-packages \
            'pytest>=8.2' 'numpy>=1.21'
          export LD_LIBRARY_PATH="${PWD}/build/nntile:/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          export PYTHONPATH="${PWD}/build/python"
          python3 -m pytest python/tests -vv

  build-examples:
    name: build examples
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-numpy
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - run: rm -rf build/_deps
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-build-examples-${{ github.sha }}
          restore-keys: ccache-build-examples-
      - run: |
          cmake -S . -B build ${CMAKE_COMMON} \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=ON
          cmake --build build --target nntile_all_examples -j"$(nproc)"
      - run: |
          chmod +x nntile/examples/run_gpt2_graph_training_demo.sh
          export LD_LIBRARY_PATH="${PWD}/build/nntile:/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          export STARPU_SILENT=1 STARPU_FXT_TRACE=0 STARPU_WORKERS_NOBIND=1
          ./nntile/examples/run_gpt2_graph_training_demo.sh
      - run: |
          chmod +x .github/scripts/ccache-print-stats.sh
          .github/scripts/ccache-print-stats.sh build-examples
      - uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-build-examples-${{ github.sha }}

  torch-nntile-device-stub:
    name: torch nntile device stub
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip g++ ninja-build
        working-directory: /
      - uses: actions/checkout@v6
      - run: |
          pip install --break-system-packages torch pytest
          CXX=g++ pip install --break-system-packages \
            -e ./torch_nntile --no-build-isolation
          pytest -vv torch_nntile/tests/test_device_stub.py

  torch-nntile-tensograph-add:
    name: torch nntile TensorGraph add
    needs: build-lib
    runs-on: ubuntu-24.04
    container: {image: ubuntu:24.04}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-pip g++ ninja-build \
            pkg-config
        working-directory: /
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - uses: actions/download-artifact@v4
        with:
          name: nntile-build
          path: build
      - run: rm -rf build/_deps
      - run: |
          set -euo pipefail
          if [ ! -e /usr/lib/x86_64-linux-gnu/libstdc++.so ]; then
            ln -sf "$(ls /usr/lib/gcc/x86_64-linux-gnu/*/libstdc++.so | tail -1)" \
              /usr/lib/x86_64-linux-gnu/libstdc++.so
          fi
          export NNTILE_BUILD_DIR="${PWD}/build"
          export NNTILE_SOURCE_DIR="${PWD}"
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export LD_LIBRARY_PATH="${PWD}/build/nntile:/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          export STARPU_SILENT=1 STARPU_FXT_TRACE=0 STARPU_WORKERS_NOBIND=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 GOTO_NUM_THREADS=1
          pip install --break-system-packages torch pytest
          CXX=g++ pip install --break-system-packages \
            -e ./torch_nntile --no-build-isolation --force-reinstall
          pytest -vv -m 'not slow' torch_nntile/tests/
