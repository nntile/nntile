name: Build and test

on:
  push:
    branches:
      - main
      - graph_api
  pull_request:
    branches:
      - main
      - graph_api
  workflow_call:
    inputs:
      is-pull-request:
        description: >-
          When true, run dirty C++ and Python tests on PR diffs instead of
          full suites. Ignored when this workflow is triggered by pull_request.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CCACHE_DIR: /tmp/ccache
  NNTILE_INSTALL: /__w/nntile/nntile/install

jobs:
  configure-smoke:
    name: Configure smoke (CMake only)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - name: Bootstrap container (git for checkout)
        working-directory: /
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-starpu-setup
      - name: Check core include paths
        run: .github/scripts/check-core-includes.sh .
      - name: Configure NNTile (smoke)
        run: |
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TESTS_PYTORCH=OFF \
            -DBUILD_PYTHON_WRAPPERS=OFF

  core-lib-build:
    name: Build nntile_core library
    needs: configure-smoke
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - name: Bootstrap container (git for checkout)
        working-directory: /
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-pr-checkout
        if: github.event_name == 'pull_request'
      - uses: ./.github/actions/nntile-ci-container
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check core include paths
        run: .github/scripts/check-core-includes.sh .
      - name: Restore ccache (core)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-core-${{ github.sha }}
          restore-keys: |
            ccache-nntile-${{ runner.os }}-core-
            ccache-nntile-${{ runner.os }}-
      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
      - name: Configure and build nntile_core
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export TORCH_PREFIX=$(
            python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_GRAPH=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="${NNTILE_INSTALL}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${TORCH_PREFIX}"
          cmake --build build -j
          cmake --build build --target nntile_compile_smoke
          cmake --install build
      - name: Save ccache (core)
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-core-${{ github.run_id }}
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
      - name: Upload nntile_core library
        uses: actions/upload-artifact@v7
        with:
          name: nntile-core-lib-${{ matrix.python-version }}
          path: |
            install/
            build/wrappers/python/nntile/nntile_core.so
          retention-days: 7

  core-tests-build:
    name: Build nntile_core C++ tests
    needs: core-lib-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - name: Bootstrap container (git for checkout)
        working-directory: /
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-pr-checkout
        if: github.event_name == 'pull_request'
      - uses: ./.github/actions/nntile-ci-container
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download nntile_core library
        uses: actions/download-artifact@v8
        with:
          name: nntile-core-lib-${{ matrix.python-version }}
          path: .
      - name: Restore ccache (core)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-core-${{ github.sha }}
          restore-keys: |
            ccache-nntile-${{ runner.os }}-core-
            ccache-nntile-${{ runner.os }}-
      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
      - name: Configure and build core C++ tests
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export TORCH_PREFIX=$(
            python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_GRAPH=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_TESTS_CORE=ON \
            -DBUILD_TESTS_GRAPH=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="${NNTILE_INSTALL}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${TORCH_PREFIX}"
          cmake --build build -j
      - name: Save ccache (core)
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-core-${{ github.run_id }}
      - name: Upload core C++ test build tree
        uses: actions/upload-artifact@v7
        with:
          name: nntile-core-ctest-${{ matrix.python-version }}
          path: |
            build/
            install/
          retention-days: 2

  core-tests-run:
    name: Run nntile_core C++ tests
    needs: core-tests-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - name: Bootstrap container (git for checkout)
        working-directory: /
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-pr-checkout
        if: github.event_name == 'pull_request'
      - uses: ./.github/actions/nntile-ci-container
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download core C++ test build tree
        uses: actions/download-artifact@v8
        with:
          name: nntile-core-ctest-${{ matrix.python-version }}
          path: .
      - name: Run smoke C++ tests (core)
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ctest --test-dir build -L smoke -E wrappers -LE "(MPI|NotImplemented)" \
            --output-on-failure
      - name: Run dirty C++ tests (core)
        if: >-
          github.event_name == 'pull_request' ||
          inputs.is-pull-request == true
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          .github/scripts/run-dirty-cpp-tests.sh \
            ${{ github.event.pull_request.head.ref }} \
            ${{ github.base_ref }} \
            core
      - name: Run core C++ tests
        if: >-
          github.event_name != 'pull_request' &&
          inputs.is-pull-request != true
        run: |
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          ctest --test-dir build -L core -E wrappers -LE "(MPI|NotImplemented)" \
            --output-on-failure

  graph-lib-build:
    name: Build nntile_graph library
    needs: core-lib-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - name: Bootstrap container (git for checkout)
        working-directory: /
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-pr-checkout
        if: github.event_name == 'pull_request'
      - uses: ./.github/actions/nntile-ci-container
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download nntile_core library
        uses: actions/download-artifact@v8
        with:
          name: nntile-core-lib-${{ matrix.python-version }}
          path: .
      - name: Restore ccache (core)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-core-${{ github.sha }}
          restore-keys: |
            ccache-nntile-${{ runner.os }}-core-
            ccache-nntile-${{ runner.os }}-
      - name: Restore ccache (graph)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-graph-${{ github.sha }}
          restore-keys: |
            ccache-nntile-${{ runner.os }}-graph-
            ccache-nntile-${{ runner.os }}-
      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
      - name: Configure and build nntile_graph
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export TORCH_PREFIX=$(
            python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_CORE=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DNNTILE_CORE_PREFIX="${NNTILE_INSTALL}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${NNTILE_INSTALL}:${TORCH_PREFIX}"
          cmake --build build -j
          cmake --build build --target nntile_compile_smoke
      - name: Save ccache (graph)
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-graph-${{ github.run_id }}
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
      - name: Verify Python extensions
        run: |
          set -euo pipefail
          test -f build/wrappers/python/nntile/nntile_core.so
          test -f build/wrappers/python/nntile/nntile_graph.so
      - name: Stage runtime libraries for artifact
        run: |
          set -euo pipefail
          mkdir -p build/lib
          cp -a "${NNTILE_INSTALL}/lib/libnntile_core.so" build/lib/
          cp -a build/libnntile_graph.so build/lib/
      - name: Upload nntile_graph library
        uses: actions/upload-artifact@v7
        with:
          name: nntile-graph-lib-${{ matrix.python-version }}
          path: |
            install/
            build/
          retention-days: 7
      - name: Upload Python extensions
        uses: actions/upload-artifact@v7
        with:
          name: shared-objects-${{ matrix.python-version }}
          path: build/**/*.so
          retention-days: 7

  graph-tests-build:
    name: Build nntile_graph C++ tests
    needs: graph-lib-build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12']
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - name: Bootstrap container (git for checkout)
        working-directory: /
        run: |
          rm -rfv /etc/apt/apt.conf.d/docker* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nntile-pr-checkout
        if: github.event_name == 'pull_request'
      - uses: ./.github/actions/nntile-ci-container
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download nntile_graph library
        uses: actions/download-artifact@v8
        with:
          name: nntile-graph-lib-${{ matrix.python-version }}
          path: .
      - name: Restore ccache (core)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-core-${{ github.sha }}
          restore-keys: |
            ccache-nntile-${{ runner.os }}-core-
            ccache-nntile-${{ runner.os }}-
      - name: Restore ccache (graph)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-graph-${{ github.sha }}
          restore-keys: |
            ccache-nntile-${{ runner.os }}-graph-
            ccache-nntile-${{ runner.os }}-
      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
      - name: Configure and build graph C++ tests
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH=/opt/starpu/lib/pkgconfig
          export TORCH_PREFIX=$(
            python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          export LD_LIBRARY_PATH=${NNTILE_INSTALL}/lib:/opt/starpu/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DBUILD_CORE=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_TESTS_CORE=OFF \
            -DBUILD_TESTS_GRAPH=ON \
            -DBUILD_EXAMPLES=OFF \
            -DNNTILE_CORE_PREFIX="${NNTILE_INSTALL}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="${NNTILE_INSTALL}:${TORCH_PREFIX}"
          cmake --build build -j
      - name: Save ccache (graph)
        uses: actions/cache/save@v4
        with:
          path: /tmp/ccache
          key: ccache-nntile-${{ runner.os }}-graph-${{ github.run_id }}
      - name: Upload graph C++ test build tree
        uses: actions/upload-artifact@v7
        with:
          name: nntile-graph-ctest-${{ matrix.python-version }}
          path: |
            build/
            install/
          retention-days: 2

  graph-tests-run:
