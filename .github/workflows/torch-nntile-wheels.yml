name: torch_nntile wheels

# Compile-only wheel builds via CMake (BUILD_TORCH_NNTILE_WHEEL). No tests.

on:
  pull_request:
    branches:
      - graph_api
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TORCH_VERSION: "2.9.1"
  TORCH_CUDA_INDEX: "https://download.pytorch.org/whl/cu128"
  TORCH_NNTILE_WHEEL_VERSION: "0.0.5"
  STARPU_GITHUB_REPO: "nntile/starpu"
  STARPU_GIT_BRANCH: "master"
  CMAKE_CUDA_ARCHITECTURES: "70;75;80;86;89;90"
  TORCH_CUDA_ARCH_LIST: "7.0;7.5;8.0;8.6;8.9;9.0"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  build-wheels:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    name: ${{ matrix.identifier }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            identifier: cp312-manylinux_x86_64
            use_cuda: "1"
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: macos-14
            identifier: cp312-macosx_arm64
            use_cuda: "0"
            container: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Build wheel (Linux manylinux, CUDA)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/wheelhouse"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/nntile-repo:rw" \
            -e TORCH_NNTILE_USE_CUDA="${{ matrix.use_cuda }}" \
            -e TORCH_VERSION="${TORCH_VERSION}" \
            -e TORCH_CUDA_INDEX="${TORCH_CUDA_INDEX}" \
            -e TORCH_NNTILE_WHEEL_VERSION="${TORCH_NNTILE_WHEEL_VERSION}" \
            -e TORCH_NNTILE_WHEELHOUSE="/nntile-repo/wheelhouse" \
            -e NNTILE_SOURCE_DIR="/nntile-repo" \
            -e NNTILE_BUILD_DIR="/tmp/nntile-build/torch_nntile_wheel" \
            -e STARPU_PREFIX="/opt/starpu" \
            -e STARPU_GITHUB_REPO="${STARPU_GITHUB_REPO}" \
            -e STARPU_GIT_BRANCH="${STARPU_GIT_BRANCH}" \
            -e CMAKE_CUDA_ARCHITECTURES="${CMAKE_CUDA_ARCHITECTURES}" \
            -e TORCH_CUDA_ARCH_LIST="${TORCH_CUDA_ARCH_LIST}" \
            -e CMAKE_BUILD_PARALLEL_LEVEL="${CMAKE_BUILD_PARALLEL_LEVEL}" \
            -e WHEEL_PYTHON="/opt/python/cp312-cp312/bin/python" \
            -w /nntile-repo \
            "${{ matrix.container }}" \
            bash torch_nntile/tools/build_wheel_deps.sh /nntile-repo

      - name: Build wheel (macOS CPU)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          export TORCH_NNTILE_USE_CUDA=0
          export NNTILE_BUILD_DIR="${RUNNER_TEMP}/nntile-build/torch_nntile_wheel"
          export STARPU_PREFIX="${RUNNER_TEMP}/starpu"
          export PKG_CONFIG_PATH="${STARPU_PREFIX}/lib/pkgconfig"
          export TORCH_NNTILE_WHEELHOUSE="${GITHUB_WORKSPACE}/wheelhouse"
          export MACOSX_DEPLOYMENT_TARGET=14.0
          mkdir -p "${TORCH_NNTILE_WHEELHOUSE}"
          bash torch_nntile/tools/build_wheel_deps.sh "${GITHUB_WORKSPACE}"

      - uses: actions/upload-artifact@v4
        with:
          name: torch-nntile-wheel-${{ matrix.identifier }}
          path: wheelhouse/*.whl
          if-no-files-found: error
