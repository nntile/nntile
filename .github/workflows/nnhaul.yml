# @file .github/workflows/nnhaul.yml
# NNTile 2.0 GPU gate: the vendored NNHaul backend on the Cheems runner
# group (CUDA GPU + driver on the host).
#
# Deliberately NOT triggered by pull_request. nntile/nntile is a public
# repository and the runner group is shared with private projects: a fork
# PR can add or edit a workflow that requests `group: cheems`, and approving
# that run would execute untrusted code on the GPU host. GPU work therefore
# runs only for pushes to protected branches and for workflow_dispatch,
# which requires write access. Fork PRs get the hosted invariants workflow;
# a maintainer brings a fork branch into the repository to get a GPU run.
#
# @version 2.0.0

name: NNTile 2.0 GPU

on:
  push:
    branches: [main, nntile-2.0]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA in this repository to test
        required: false
        default: ""

permissions:
  contents: read

env:
  # The runners have the toolkit in /usr/local/cuda but not on PATH for
  # non-login shells; nvcc must be discoverable by CMake and torch.
  CUDA_HOME: /usr/local/cuda
  PATH: /usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

concurrency:
  group: nntile-2.0-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nnhaul-suite:
    name: NNHaul engine + nntile suites
    runs-on:
      group: cheems
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: configure
        run: |
          cmake -S . -B build-nnhaul -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_LIBTORCH_NNTILE=OFF \
            -DBUILD_TORCH_NNTILE=OFF \
            -DNNHAUL_BUILD_TESTS=ON \
            -DBUILD_TESTING=ON

      - name: build
        run: cmake --build build-nnhaul -j"$(nproc)"

      - name: engine + nntile suites (1 MiB chunk class)
        run: NNHAUL_CHUNK_SIZE_MB=1 sh tools/run_chunked_suite.sh build-nnhaul

      - name: engine + nntile suites (2 MiB chunk class)
        run: NNHAUL_CHUNK_SIZE_MB=2 sh tools/run_chunked_suite.sh build-nnhaul

  torch-product:
    name: torch_nntile product
    runs-on:
      group: cheems
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Python and PyTorch
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" -m pip install --upgrade pip
          WHEEL_PYTHON="${RUNNER_TEMP}/venv/bin/python" \
            bash torch_nntile/tools/ensure_torch_cuda.sh
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: configure product
        run: |
          TORCH_PREFIX=$(python3 -c 'import torch; print(torch.utils.cmake_prefix_path)')
          cmake -S . -B build-torch -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$TORCH_PREFIX" \
            -DPython3_EXECUTABLE="$(command -v python3)"

      - name: build product
        run: cmake --build build-torch -j"$(nproc)"

      - name: install wheel
        run: |
          python3 -m pip install --force-reinstall --no-deps \
            build-torch/wheelhouse/torch_nntile-*.whl

      - name: wheel smoke
        run: python3 torch_nntile/tools/smoke_test_wheel.py

      - name: Python tests
        env:
          NNTILE_ENABLE_LOCAL_COMPILER: "1"
        run: |
          python3 -m pip install pytest
          cd torch_nntile
          python3 -m pytest -q tests

      - name: GPT-2 training smoke
        run: |
          python3 torch_nntile/examples/train_gpt2.py train \
            --config torch_nntile/examples/gpt2_hf_tiny_config.json \
            --seed 0 --seq-len 32 --batch-size 2 --max-sequences 4 \
            --epochs 1 --no-save-checkpoint \
            --output-dir "${RUNNER_TEMP}/gpt2-smoke" --ncuda 1 \
            --pipelined-issue > "${RUNNER_TEMP}/gpt2-smoke.log" 2>&1
          cat "${RUNNER_TEMP}/gpt2-smoke.log"
          grep -q "final loss=" "${RUNNER_TEMP}/gpt2-smoke.log"
          if grep -qiE "final loss=(nan|inf)" "${RUNNER_TEMP}/gpt2-smoke.log"; then
            echo "GPT-2 smoke produced a non-finite loss" >&2
            exit 1
          fi
