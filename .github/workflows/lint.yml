name: Lint

on:
  pull_request:
    branches: [main, nntile-2.0]
  push:
    branches: [main, nntile-2.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting with Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          cache: pip
          python-version: ${{ matrix.python-version }}
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit on pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/${BASE_REF}" HEAD)
          pre-commit run --from-ref "${base}" --to-ref HEAD
      - name: Run pre-commit on merge
        if: github.event_name != 'pull_request'
        run: pre-commit run --all-files
      - name: Check public include layout
        if: matrix.python-version == '3.12'
        run: bash .github/scripts/check-nntile-includes.sh .
