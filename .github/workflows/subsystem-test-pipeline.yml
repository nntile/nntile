# Per-subsystem tests: compile test objects once, link once, run ctest (single job).
name: Subsystem test pipeline

on:
  workflow_call:
    inputs:
      subsystem:
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/starpu/lib
  NNTILE_CI_CONTAINER_IMAGE: >-
    ghcr.io/nntile/nntile_sandbox:starpu1.4-9253daf_sgoc_pytorch2.9.1_cuda12.9.1

jobs:
  subsystem-test:
    name: subsystem-test-${{ inputs.subsystem }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.NNTILE_CI_CONTAINER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/download-nntile-catch2-deps
      - uses: ./.github/actions/restore-nntile-prebuilt-lib-cache
      - uses: ./.github/actions/restore-nntile-test-obj-dep-caches
        with:
          subsystem: ${{ inputs.subsystem }}
      - run: |
          chmod +x .github/scripts/extract-nntile-test-obj-dep-archives.sh
          chmod +x .github/scripts/subsystem-test-pipeline.sh
          chmod +x .github/scripts/pack-nntile-test-objs.sh
          .github/scripts/extract-nntile-test-obj-dep-archives.sh \
              "${{ inputs.subsystem }}" build
      - run: .github/scripts/subsystem-test-pipeline.sh "${{ inputs.subsystem }}" build
      - run: .github/scripts/pack-nntile-test-objs.sh "${{ inputs.subsystem }}" build
      - uses: actions/cache/save@v4
        with:
          path: >-
            build/nntile_test_objs_cache/nntile_test_objs_${{ inputs.subsystem }}.tar.gz
          key: nntile-test-obj-a-${{ inputs.subsystem }}-${{ github.sha }}
