# Per-subsystem test pipeline: compile-check-tests → build-tests → test-run.
# Called from build-test.yml with one matrix leg per subsystem so build-tests
# depends only on compile-check-tests for the same subsystem (not all nine).
name: Subsystem test pipeline

on:
  workflow_call:
    inputs:
      subsystem:
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  CCACHE_DIR: /tmp/ccache
  PKG_CONFIG_PATH: /opt/starpu/lib/pkgconfig
  LD_LIBRARY_PATH: /opt/starpu/lib
  NNTILE_CI_CONTAINER_IMAGE: >-
    ghcr.io/nntile/nntile_sandbox:starpu1.4-9253daf_sgoc_pytorch2.9.1_cuda12.9.1

jobs:
  compile-check-tests:
    name: compile-check-tests-${{ inputs.subsystem }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.NNTILE_CI_CONTAINER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/download-nntile-catch2-deps
      - run: |
          chmod +x .github/scripts/verify-catch2-deps-for-compile-check.sh
          chmod +x .github/scripts/nntile-test-obj-subsystems.sh
          chmod +x .github/scripts/pack-nntile-test-objs.sh
          .github/scripts/verify-catch2-deps-for-compile-check.sh build
      - run: |
          for _dep in $(.github/scripts/nntile-test-obj-subsystems.sh \
              "${{ inputs.subsystem }}"); do
            echo "=== compile-check-tests ${_dep} ==="
            cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
              -DNNTILE_COMPILE_CHECK_TESTS_SUBSYSTEM="${_dep}" \
              -DNNTILE_FETCHCONTENT_DISCONNECTED=ON \
              -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPERS=OFF \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build --target "nntile_compile_check_tests_${_dep}"
            .github/scripts/pack-nntile-test-objs.sh "${_dep}" build
          done
      - uses: actions/cache/save@v4
        with:
          path: build/nntile_test_objs_cache
          key: nntile-test-obj-deps-${{ inputs.subsystem }}-${{ github.sha }}

  build-tests:
    name: build-tests-${{ inputs.subsystem }}
    needs: compile-check-tests
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.NNTILE_CI_CONTAINER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/download-nntile-catch2-deps
      - uses: ./.github/actions/restore-nntile-prebuilt-lib-cache
      - uses: ./.github/actions/restore-nntile-test-obj-deps
        with:
          subsystem: ${{ inputs.subsystem }}
      - run: |
          chmod +x .github/scripts/cmake-build-tests-subsystem.sh
          chmod +x .github/scripts/cmake-test-build-targets.sh
          chmod +x .github/scripts/nntile-prebuilt-lib-path.sh
          chmod +x .github/scripts/restore-nntile-test-obj-deps.sh
          _lib=$(
            .github/scripts/nntile-prebuilt-lib-path.sh build
          )
          mapfile -t _test_flags < <(.github/scripts/cmake-build-tests-subsystem.sh "${{ inputs.subsystem }}")
          .github/scripts/restore-nntile-test-obj-deps.sh "${{ inputs.subsystem }}" build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DUSE_CUDA=OFF \
            -DNNTILE_PRESET=full -DNNTILE_PREBUILT_LIBRARY="${_lib}" \
            -DNNTILE_LINK_CACHED_TEST_OBJECTS=ON \
            -DBUILD_TESTS=ON -DBUILD_TESTS_PYTORCH=OFF \
            -DNNTILE_FETCHCONTENT_DISCONNECTED=ON \
            -DBUILD_EXAMPLES=OFF -DBUILD_PYTHON_WRAPPERS=OFF \
            "${_test_flags[@]}"
          echo "=== BUILD_TESTS_* (must enable only this subsystem) ==="
          grep '^BUILD_TESTS_' build/CMakeCache.txt || true
          mapfile -t _test_targets < <(.github/scripts/cmake-test-build-targets.sh \
            "${{ inputs.subsystem }}" build)
          echo "=== ninja plan (link test executables only; libnntile is prebuilt) ==="
          ninja -C build -n "${_test_targets[@]}" 2>&1 | tee /tmp/build-tests-ninja-plan.txt
          if grep -E 'CXX_COMPILER|CUDA_COMPILER' /tmp/build-tests-ninja-plan.txt \
              | grep -qE 'nntile/src/|nntile/tests/CMakeFiles/nntile_test_objs_.*\.cc\.o:'; then
            echo "unexpected library or test source compile" >&2
            grep -E 'CXX_COMPILER|CUDA_COMPILER' /tmp/build-tests-ninja-plan.txt \
              | grep -E 'nntile/src/|nntile_test_objs_.*\.cc\.o:' >&2 || true
            exit 1
          fi
          echo "Linking ${#_test_targets[@]} test executable(s) against prebuilt libnntile"
          cmake --build build --target "${_test_targets[@]}" -j"$(nproc)"
      - uses: actions/cache/save@v4
        with:
          path: build
          key: build-tests-${{ inputs.subsystem }}-${{ github.sha }}

  test-run:
    name: test-run-${{ inputs.subsystem }}
    needs: build-tests
    runs-on: ubuntu-24.04
    container:
      image: ${{ env.NNTILE_CI_CONTAINER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: /__w/nntile/nntile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache/restore@v4
        with:
          path: build
          key: build-tests-${{ inputs.subsystem }}-${{ github.sha }}
          fail-on-cache-miss: true
      - run: |
          chmod +x .github/scripts/ctest-run-subsystem.sh
          chmod +x .github/scripts/ctest-label-exclude-subsystem.sh
      - run: |
          export LD_LIBRARY_PATH="/opt/starpu/lib:${LD_LIBRARY_PATH:-}"
          _re=$(.github/scripts/ctest-run-subsystem.sh "${{ inputs.subsystem }}")
          _le=$(.github/scripts/ctest-label-exclude-subsystem.sh \
              "${{ inputs.subsystem }}")
          cd build && ctest -R "${_re}" -LE "${_le}" -j"$(nproc)" \
            --output-on-failure
