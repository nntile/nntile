[build-system]
requires = ["setuptools>=61", "torch>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_nntile"
version = "0.0.1"
description = "PyTorch PrivateUse1 device for nntile (TensorGraph ops via libnntile)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.9.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
pythonpath = ["."]
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["torch_nntile*"]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux* *-win*"
build-frontend = "pip; args: --no-build-isolation"
before-all = "bash {package}/tools/build_wheel_deps.sh \"$NNTILE_SOURCE_DIR\""
before-build = [
    "python -m pip install --upgrade pip",
    "python -m pip install 'setuptools>=61,<82' wheel ninja",
]
test-command = "python {package}/tools/smoke_test_wheel.py"

[tool.cibuildwheel.environment]
STARPU_SILENT = "1"
STARPU_FXT_TRACE = "0"
STARPU_WORKERS_NOBIND = "1"

TORCH_NNTILE_REQUIRE_LIBNNTILE = "1"
TORCH_NNTILE_WHEEL = "1"
TORCH_NNTILE_CXX_STANDARD = "c++20"

[tool.cibuildwheel.test-environment]
STARPU_SILENT = "1"
STARPU_FXT_TRACE = "0"
STARPU_WORKERS_NOBIND = "1"

OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-test = "python -m pip install --index-url https://download.pytorch.org/whl/cu128 'torch==2.9.1'"
repair-wheel-command = "bash {package}/tools/repair_wheel_linux.sh {wheel} {dest_dir}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-test = "python -m pip install 'torch==2.9.1'"
repair-wheel-command = "bash {package}/tools/repair_wheel_macos.sh {wheel} {dest_dir} {delocate_archs}"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_*"
inherit.environment = "append"
environment.TORCH_NNTILE_USE_CUDA = "1"

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", TORCH_NNTILE_USE_CUDA = "0" }
