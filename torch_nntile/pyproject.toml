[build-system]
requires = ["setuptools>=61", "torch>=2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_nntile"
version = "0.0.5"
description = "PyTorch PrivateUse1 device for nntile (TensorGraph ops via libnntile)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    'nvidia-cublas-cu12>=12.8.4.1; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cudnn-cu12>=9.10.2.21; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cusparse-cu12>=12.5.8.93; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cusolver-cu12>=11.7.3.90; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-nvjitlink-cu12>=12.8.93; platform_system == "Linux" and platform_machine == "x86_64"',
    'nvidia-cuda-runtime-cu12>=12.8.90; platform_system == "Linux" and platform_machine == "x86_64"',
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
pythonpath = ["."]
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["torch_nntile*"]

[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux* *-win*"
build-frontend = "pip; args: --no-build-isolation"
before-all = "bash {package}/tools/build_wheel_deps.sh \"$NNTILE_SOURCE_DIR\""
before-build = [
    "python -m pip install --upgrade pip",
    "python -m pip install 'setuptools>=61,<82' wheel ninja numpy",
    "python -m pip install 'torch==2.9.1' 'torchvision==0.24.1'",
]
test-command = "python {package}/tools/smoke_test_wheel.py"

[tool.cibuildwheel.environment]
STARPU_SILENT = "1"
STARPU_FXT_TRACE = "0"
STARPU_WORKERS_NOBIND = "1"

TORCH_NNTILE_REQUIRE_LIBNNTILE = "1"
TORCH_NNTILE_WHEEL = "1"
TORCH_NNTILE_CXX_STANDARD = "c++20"

[tool.cibuildwheel.test-environment]
STARPU_SILENT = "1"
STARPU_FXT_TRACE = "0"
STARPU_WORKERS_NOBIND = "1"

OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-build = [
    "python -m pip install --upgrade pip",
    "python -m pip install 'setuptools>=61,<82' wheel ninja numpy",
    "python -m pip install --index-url https://download.pytorch.org/whl/cu128 'torch==2.9.1' 'torchvision==0.24.1'",
    "python -m pip install nvidia-cudnn-cu12",
]
before-test = [
    "python -m pip install 'torch==2.9.1' 'torchvision==0.24.1'",
    "python -m pip install nvidia-cublas-cu12 nvidia-cudnn-cu12 nvidia-cusparse-cu12 nvidia-cusolver-cu12 nvidia-nvjitlink-cu12 nvidia-cuda-runtime-cu12",
]
repair-wheel-command = "bash {package}/tools/repair_wheel_linux.sh {wheel} {dest_dir}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-test = "python -m pip install 'torch==2.9.1' 'torchvision==0.24.1'"
repair-wheel-command = "bash {package}/tools/repair_wheel_macos.sh {wheel} {dest_dir} {delocate_archs}"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_*"
inherit.environment = "append"
environment.TORCH_NNTILE_USE_CUDA = "1"
environment.CUDA_HOME = "/usr/local/cuda"
environment.PATH = "/usr/local/cuda/bin:$PATH"
environment.LD_LIBRARY_PATH = "/usr/local/cuda/lib64:/usr/local/cuda/lib64/stubs:$LD_LIBRARY_PATH"

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0", TORCH_NNTILE_USE_CUDA = "0" }
